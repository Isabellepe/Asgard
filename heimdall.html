<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Asgard Burguer</title>
</head>
<body>
    <header>
        <a href="./index.html"><img src="./imagens/logotranspa.png" id="logoimg"></a>
        <h5 id="logo">Asgard Burguer</h5>
        <nav id="nav">
            <a href="./index.html">Menu </a>
            <a href="./sobre.html">Sobre </a>
            <a href="./contato.html">Contato </a>
        </nav>
    </header>
    <main>
        <section id="principal">
            <h1>Heimdall Burguer</h1>
            
            
        </section>

        <section id="menu">
            
            <article class="cardheimdall">
                <img src="./imagens/heim3.jpg" alt="imagem de um Heimdall Burguer do Asgard" >
                <p id="heimdall">R$ 24,90</p>
            </article>
            <article class="cardheimdall2">
                
                <p id="heimdall">Pão brioche, Blend bovino 160g, Queijo cheddar ou mussarela.</p>
                <br>
                
                <div class="ingredientes">
                <h3 id="queijocarne">Queijos</h3>
                <h4>Queijo cheddar</h4>
                </div>
                <input type="radio" name="queijo" value="cheddar">
                <span class="checkmark"></span>
                
                <div class="ingredientes">
                <h4>Queijo mussarela</h4>
                </div>
                <input type="radio" name="queijo" value="mussarela">
                <span class="checkmark"></span>


                <div class="ingredientes">
                <h3 id="queijocarne">Ponto da Carne</h3>
                <h4>Ao ponto</h4>
                </div>
                <input type="radio" name="carne" value="Ao ponto">
                <span class="checkmark"></span>
                
                <div class="ingredientes">
                <h4>Bem passado</h4>
                </div>
                <input type="radio" name="carne" value="Bem passado">
                <span class="checkmark"></span>

                <div class="ingredientes">
                <h4>Ao ponto para bem</h4>
                </div>
                <input type="radio" name="carne" value="Ao ponto para bem">
                <span class="checkmark"></span>
                
                <div class="ingredientes">
                <h4>Ao ponto para mal</h4>
                </div>
                <input type="radio" name="carne" value="Ao ponto para mal">
                <span class="checkmark"></span>
                
                <div class="ingredientes">
                <h4>Mal</h4>
                </div>
                <input type="radio" name="carne" value="Mal">
                <span class="checkmark"></span>
            
                <div class="ingredientes">
                <h3 id="queijocarne">Observação:</h3>
                </div>
                <input type="text" name="Observação" placeholder="Ex:Tirar cebola, ovo, etc.">
                <br>
                <a href="./contato.html"><img src="./imagens/pedido.png" alt="imagem de faça seu pedido" ></a>
                
            </article>
            
        </section>
    </main>
    <footer>

    </footer>
</body>
</html>
